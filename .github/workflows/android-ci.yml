name: Android CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and lint
        run: ./gradlew :shared:testDebugUnitTest :androidApp:testDebugUnitTest :androidApp:lintDebug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  release:
    name: Build signed APK and publish
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "SIGNING_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Prepare and verify APK
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk dist/ProximityDemo.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs dist/ProximityDemo.apk
          (cd dist && sha256sum ProximityDemo.apk > ProximityDemo.apk.sha256 && cat ProximityDemo.apk.sha256)

      - name: Publish to the rolling "latest" release
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          NOTES="Build #${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}. Always the newest build of main."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Latest build" --notes "$NOTES" --latest
          else
            gh release create latest --title "Latest build" --notes "$NOTES" --latest
          fi
          gh release upload latest dist/ProximityDemo.apk dist/ProximityDemo.apk.sha256 --clobber

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
